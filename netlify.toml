# Netlify configuration for React SPA with React Router
[build]
  # Build command
  command = "npm run build"
  # Output directory
  publish = "dist"

# Essential redirects for React Router - handles client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  # This is crucial for React Router to work properly in production
  # All routes will be handled by React Router instead of server

# Environment variables for build
[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# Headers for better performance and security
[[headers]]
  for = "/*"
  [headers.values]
    # Enable GZIP compression
    Content-Encoding = "gzip"
    # Cache static assets
    Cache-Control = "public, max-age=31536000"
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Specific headers for HTML files
[[headers]]
  for = "/*.html"
  [headers.values]
    # Don't cache HTML files to ensure updates are reflected
    Cache-Control = "public, max-age=0, must-revalidate"

# Headers for API routes (if you have any)
[[headers]]
  for = "/api/*"
  [headers.values]
    # CORS headers for API endpoints
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"